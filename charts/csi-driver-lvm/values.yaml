lvm:
  # This one you should change
  devicePattern: /dev/nvme[0-9]n[0-9]

  # You will want to change this for read-only filesystems
  # For example, in Talos OS, set this to "/var/etc/lvm"
  hostWritePath: /etc/lvm

  # these are primariliy for testing purposes
  vgName: csi-lvm
  driverName: lvm.csi.metal-stack.io
  storageClassStub: csi-driver-lvm
  logLevel: info

rbac:
  create: true
  pspEnabled: true

## enable, if you want to install storage classes with v0.3.x backward-compatible `csi-lvm-sc-*` names
compat03x: false

evictionEnabled: false

pluginImage:
  repository: ghcr.io/metal-stack/csi-driver-lvm
  tag: latest
  pullPolicy: IfNotPresent

evictionControllerImage:
  repository: ghcr.io/metal-stack/csi-driver-lvm-controller
  tag: latest
  pullPolicy: IfNotPresent

sidecarImages:
  attacher: registry.k8s.io/sig-storage/csi-attacher:v4.13.0
  livenessprobe: registry.k8s.io/sig-storage/livenessprobe:v2.20.0
  provisioner: registry.k8s.io/sig-storage/csi-provisioner:v6.4.0
  registrar: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0
  resizer: registry.k8s.io/sig-storage/csi-resizer:v2.3.0

resources:
  plugin: {}
  attacher: {}
  livenessprobe: {}
  provisioner: {}
  registrar: {}
  resizer: {}

kubernetes:
  kubeletPath: /var/lib/kubelet

storageClasses:
  linear:
    enabled: true
    additionalAnnotations: []
    # this might be used to mark one of the StorageClasses as default:
    # storageclass.kubernetes.io/is-default-class: "true"
    reclaimPolicy: Delete
    mountOptions: []
  striped:
    enabled: true
    additionalAnnotations: []
    reclaimPolicy: Delete
    mountOptions: []
  mirror:
    enabled: true
    additionalAnnotations: []
    reclaimPolicy: Delete
    mountOptions: []
  linearEncrypted:
    enabled: false
    additionalAnnotations: []
    reclaimPolicy: Delete
    encryptionSecret:
      name: csi-lvm-encryption-secret
      namespace: default
    mountOptions: []
  stripedEncrypted:
    enabled: false
    additionalAnnotations: []
    reclaimPolicy: Delete
    encryptionSecret:
      name: csi-lvm-encryption-secret
      namespace: default
    mountOptions: []
  mirrorEncrypted:
    enabled: false
    additionalAnnotations: []
    reclaimPolicy: Delete
    encryptionSecret:
      name: csi-lvm-encryption-secret
      namespace: default
    mountOptions: []

nodeSelector:
  # The plugin daemonset will run on all nodes if it has a toleration,
  # so it is not necessary to set a nodeSelector for it

  # plugin:
  #   node-role.kubernetes.io/master: ""
  #   # Key name may need to be updated to 'node-role.kubernetes.io/control-plane'
  #   # in the future

  # The provisioner has an affinity for nodes with a plugin pod,
  # but since that's a daemonset, we allow more fine-grained node selection

  provisioner:
    # node-role.kubernetes.io/master: ""
    # Key name may need to be updated to 'node-role.kubernetes.io/control-plane'
    # in the future

tolerations:
  plugin:
  # - key: node-role.kubernetes.io/master
  #   operator: Exists
  #   effect: NoSchedule
  # - key: node-role.kubernetes.io/control-plane
  #   operator: Exists
  #   effect: NoSchedule
  provisioner:
  # - key: node-role.kubernetes.io/master
  #   operator: Exists
  #   effect: NoSchedule
  # - key: node-role.kubernetes.io/control-plane
  #   operator: Exists
  #   effect: NoSchedule
