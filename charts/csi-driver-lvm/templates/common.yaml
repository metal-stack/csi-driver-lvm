---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: {{ include "csi-driver-lvm.csi-driver.fullname" . }}
  labels: {{- include "csi-driver-lvm.labels" . | nindent 4 }}
spec:
  volumeLifecycleModes:
  - Persistent
  - Ephemeral
  podInfoOnMount: true
  attachRequired: false
  storageCapacity: true
