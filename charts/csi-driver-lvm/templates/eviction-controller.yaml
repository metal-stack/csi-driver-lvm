{{- if and .Values.evictionEnabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "csi-driver-lvm.eviction.serviceaccount.fullname" . }}
  labels: {{- include "csi-driver-lvm.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "csi-driver-lvm.eviction.clusterrole.fullname" . }}
  labels: {{- include "csi-driver-lvm.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - nodes
      - persistentvolumes
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - delete
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - storage.k8s.io
    resources:
      - storageclasses
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "csi-driver-lvm.eviction.clusterrolebinding.fullname" . }}
  labels: {{- include "csi-driver-lvm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "csi-driver-lvm.eviction.clusterrole.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "csi-driver-lvm.eviction.serviceaccount.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "csi-driver-lvm.eviction.deployment.fullname" . }}
  labels: {{- include "csi-driver-lvm.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{ include "csi-driver-lvm.eviction.selectorlabels" . | nindent 6 }}
  replicas: 1
  template:
    metadata:
      labels: {{ include "csi-driver-lvm.eviction.selectorlabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - command:
            - /controller
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --provisioner-name={{ include "csi-driver-lvm.csi-driver.fullname" . }}
          image: "{{ .Values.evictionControllerImage.repository }}:{{ .Values.evictionControllerImage.tag }}"
          imagePullPolicy: {{ .Values.evictionControllerImage.pullPolicy }}
          name: {{ include "csi-driver-lvm.eviction.deployment.fullname" . }}
          ports: []
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts: []
      volumes: []
      serviceAccountName: {{ include "csi-driver-lvm.eviction.serviceaccount.fullname" . }}
      terminationGracePeriodSeconds: 10
{{- end }}
