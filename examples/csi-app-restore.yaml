kind: Pod
apiVersion: v1
metadata:
  name: my-csi-app-restore
spec:
  # a snapshot can only be restored on the node that holds it, pin the pod to that node
  # nodeSelector:
  #   kubernetes.io/hostname: <node of the source volume>
  containers:
    - name: my-frontend
      image: busybox
      volumeMounts:
      - mountPath: "/data"
        name: my-csi-volume
      command: [ "sleep", "1000000" ]
  volumes:
    - name: my-csi-volume
      persistentVolumeClaim:
        claimName: csi-pvc-restore
