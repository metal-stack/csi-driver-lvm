kind: Pod
apiVersion: v1
metadata:
  name: volume-test-inline-mkfsparams
spec:
  containers:
  - name: inline
    image: alpine
    imagePullPolicy: IfNotPresent
    command:
      - tail
      - -f
      - /etc/hosts
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 10014
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL
    volumeMounts:
      - mountPath: /data
        name: lvm-pvc-inline-mkfsparams
    resources:
      limits:
        cpu: 100m
        memory: 100M
  volumes:
    - name: lvm-pvc-inline-mkfsparams
      csi:
        driver: lvm.csi.metal-stack.io
        fsType: xfs
        volumeAttributes:
          size: "400MB"
          type: "linear"
          additionalMkfsParams: "-i nrext64=1 -m rmapbt=0"
