apiVersion: v1
kind: Pod
metadata:
  name: volume-snapshot-block-source
spec:
  containers:
  - name: volume-snapshot-block-source
    image: alpine
    imagePullPolicy: IfNotPresent
    command:
      - /bin/sh
      - -c
      - sleep 1000000
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 10014
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL
    volumeDevices:
      - name: block
        devicePath: /dev/xvda
    resources:
      limits:
        cpu: 100m
        memory: 100M
  volumes:
  - name: block
    persistentVolumeClaim:
      claimName: lvm-pvc-snapshot-block-source
