apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lvm-pvc-snapshot-restore
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: csi-driver-lvm-snapshot-xfs
  resources:
    requests:
      storage: 500Mi
  dataSource:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: lvm-snapshot
