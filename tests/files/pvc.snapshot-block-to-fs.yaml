apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lvm-pvc-snapshot-block-to-fs
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: csi-driver-lvm-linear
  resources:
    requests:
      storage: 100Mi
  dataSource:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: lvm-snapshot-block
