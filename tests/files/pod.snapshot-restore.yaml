apiVersion: v1
kind: Pod
metadata:
  name: volume-snapshot-restore
spec:
  # a snapshot can only be restored on its node, SNAPSHOT_NODE is replaced by the test
  nodeSelector:
    kubernetes.io/hostname: SNAPSHOT_NODE
  containers:
  - name: volume-snapshot-restore
    image: alpine
    imagePullPolicy: IfNotPresent
    command:
      - /bin/sh
      - -c
      - sleep 1000000
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 10014
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL
    volumeMounts:
    - name: data
      mountPath: /data
    resources:
      limits:
        cpu: 100m
        memory: 100M
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: lvm-pvc-snapshot-restore
